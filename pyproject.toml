[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hscredit"
dynamic = ["version"]
description = "hscredit 面向金融信贷风控策略分析与评分模型研发场景，提供符合 sklearn Pipeline 范式的量化建模工具箱，覆盖数据探索、特征筛选、分箱编码、有效性评估、模型训练、参数调优与报告生成，支持从策略验证到模型落地的端到端风险决策流程。鉴真伪，斟信用，衡风险，枢定策 —— 衡枢真信，智能风控，一站掌控。"
readme = "README.md"
license = "MIT"
authors = [
    {name = "hscredit team", email = "hscredit@hengshucredit.com"}
]
maintainers = [
    {name = "hscredit team", email = "hscredit@hengshucredit.com"}
]
keywords = [
    "credit",
    "risk",
    "scorecard",
    "model",
    "finance",
    "machine-learning",
    "deep-learning",
    "woe",
    "binning",
    "excel",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Office/Business :: Financial",
]
requires-python = ">=3.9,<3.15"
dependencies = [
    "cython>=0.29",
    "numpy>=1.23.0",
    "pandas>=2.0.0",
    "pyarrow>=12",
    "packaging",
    "scipy>=1.5.0",
    "numexpr>=2.8.4",
    "bottleneck>=1.3.6",
    "scikit-learn>=0.24.0",
    "statsmodels>=0.12.0",
    "joblib>=1.0.0",
    "openpyxl>=3.1.0",
    "matplotlib>=3.3.0",
    "seaborn>=0.13.2",
    "pyecharts>=1.9.0",
    "graphviz>=0.16",
    "tqdm>=4.50.0",
    "IPython>=7.0.0",
    "ortools>=9.0",
    "dill>=0.3.4",
    "cloudpickle>=2.0.0",
    "lz4>=3.1.0",
    "zstandard>=0.15.0",
    "shap>=0.49.1,<0.50; python_version < '3.14'",
    "shap>=0.51,<0.53; python_version >= '3.14'",
]

[project.optional-dependencies]
boost = [
    "xgboost>=1.4.0",
    "lightgbm>=3.2.0",
    "catboost>=1.0.0",
    "ngboost>=0.3.0",
]
net = [
    "torch>=1.8.0",
    "pytorch-tabnet>=3.1",
]
pmml = [
    "sklearn2pmml>=0.82.0",
    "pypmml>=1.5.8",
    "JPype1<1.7; python_version < '3.10' and platform_system == 'Windows'",
]
tune = [
    "optuna>=3.0.0",
    "optuna-dashboard",
    "optunahub",
    "cmaes",
    "plotly",
]
skills = ["jsonschema>=4.18"]
db-mysql = [
    "DBUtils>=3.1.2,<4",
    "PyMySQL>=1.1,<2",
]
db-hive = [
    "DBUtils>=3.1.2,<4",
    "impyla>=0.22,<1",
]
db-impala = [
    "DBUtils>=3.1.2,<4",
    "impyla>=0.22,<1",
]
db-oracle = ["oracledb>=2,<5"]
db-starrocks = [
    "DBUtils>=3.1.2,<4",
    "PyMySQL>=1.1,<2",
]
db-clickhouse = [
    "clickhouse-connect>=0.7.17,<0.14.1; python_version < '3.10'",
    "clickhouse-connect>=1.0,<2; python_version >= '3.10'",
]
db-maxcompute = ["pyodps>=0.12.6,<1"]
database-all = [
    "hscredit[db-mysql,db-hive,db-impala,db-oracle,db-starrocks,db-clickhouse,db-maxcompute]",
]
dev = [
    "pytest>=6.0.0",
    "pytest-cov>=2.0.0",
    "nbclient>=0.5",
    "nbformat>=5",
    "ipykernel>=6.0",
    "black>=21.0",
    "flake8>=3.9.0",
    "mypy>=1.8",
    "build>=1.0.0",
    "twine>=4.0.0",
    "check-manifest>=0.49",
    "tomli; python_version < '3.11'",
]
docs = [
    "sphinx>=4.0.0,<9",
    "sphinx-rtd-theme>=0.5.0",
    "nbsphinx>=0.8.0",
    "myst-parser>=2.0.0",
]
all = [
    "hscredit[boost,net,pmml,tune,skills,database-all,dev,docs]"
]

[project.urls]
Homepage = "https://github.com/hscredit/hscredit"
Documentation = "https://hscredit.readthedocs.io"
Repository = "https://github.com/hscredit/hscredit.git"
Issues = "https://github.com/hscredit/hscredit/issues"

[tool.setuptools.dynamic]
# 版本号手动维护，唯一来源为 hscredit/__init__.py 的 __version__。
# setuptools 通过 AST 解析提取该字面量，无需在构建期导入 hscredit（避免触发重依赖）。
version = {attr = "hscredit.__version__"}

[tool.setuptools.packages.find]
exclude = [
    "tests", "tests.*",
    "docs", "docs.*",
    "examples", "examples.*",
    "skills", "skills.*",
    "scripts", "scripts.*",
    "build", "build.*",
]

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.package-data]
hscredit = ["py.typed", "resources/**/*"]

[tool.black]
line-length = 512
target-version = ['py39', 'py310', 'py311', 'py312', 'py313', 'py314']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  # 保留原有项目
  | scorecardpipeline
  | scorecardpy
  | toad
  | optbinning
  | skorecard
)/
'''

[tool.coverage.run]
source = ["hscredit"]
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
