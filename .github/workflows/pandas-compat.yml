name: pandas apply 版本兼容验证

on:
  push:
    branches: [main, master]
    paths:
      - "hscredit/_compat.py"
      - "hscredit/utils/pandas_parallel.py"
      - "tests/test_utils/test_pandas*.py"
      - ".github/workflows/pandas-compat.yml"
      - "pyproject.toml"
  pull_request:
    paths:
      - "hscredit/_compat.py"
      - "hscredit/utils/pandas_parallel.py"
      - "tests/test_utils/test_pandas*.py"
      - ".github/workflows/pandas-compat.yml"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  pandas-compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            pandas: "2.0.3"
            numpy: "1.26.4"
          - python: "3.10"
            pandas: "2.1.4"
            numpy: "1.26.4"
          - python: "3.11"
            pandas: "2.2.3"
            numpy: "2.2.6"
          - python: "3.11"
            pandas: "2.3.3"
            numpy: "2.2.6"
          - python: "3.11"
            pandas: "3.0.6"
            numpy: "2.4.6"
          - python: "3.11"
            pandas: "3.1.0"
            numpy: "2.4.6"
    env:
      MPLBACKEND: Agg
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: 安装版本组合
        run: >-
          python -m pip install -e ".[dev]"
          "pandas==${{ matrix.pandas }}" "numpy==${{ matrix.numpy }}"
      - name: 验证原生参数、缺失值、分组和单次执行语义
        run: >-
          python -m pytest tests/test_utils/test_pandas_parallel_apply.py
          tests/test_utils/test_pandas_version_compat.py -q --tb=short
