name: CPU 探测跨平台兼容验证

on:
  push:
    branches: [main]
    paths:
      - "hscredit/_cpu.py"
      - "hscredit/_compat.py"
      - "hscredit/utils/parallel.py"
      - "tests/test_utils/test_cpu_compat.py"
      - "tests/test_utils/test_parallel_runtime.py"
      - ".github/workflows/cpu-compat.yml"
      - "pyproject.toml"
  pull_request:
    paths:
      - "hscredit/_cpu.py"
      - "hscredit/_compat.py"
      - "hscredit/utils/parallel.py"
      - "tests/test_utils/test_cpu_compat.py"
      - "tests/test_utils/test_parallel_runtime.py"
      - ".github/workflows/cpu-compat.yml"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  cpu-compat:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        joblib: ["1.4.2", "1.6.0"]
    env:
      MPLBACKEND: Agg
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: 安装指定版本组合
        run: python -m pip install -e ".[dev]" "joblib==${{ matrix.joblib }}"
      - name: 验证物理核、动态预算及下游入口
        run: >-
          python -m pytest tests/test_utils/test_cpu_compat.py
          tests/test_utils/test_parallel.py tests/test_utils/test_parallel_runtime.py
          -q --tb=short
      - name: 校验当前平台的 CPU 接口类型
        run: python -m mypy hscredit/_cpu.py --follow-imports=skip --ignore-missing-imports
