name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# 同一分支的重复触发只保留最新一次
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 避免 CI 无显示环境下 matplotlib 选择 Tk 等 GUI 后端导致失败
  MPLBACKEND: Agg
  PYTHONUTF8: "1"

jobs:
  quality:
    name: 强制质量门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装全部依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"

      - name: 关键静态错误检查
        run: flake8 hscredit tests --select=E9,F63,F7,F82,F601

      - name: 新增基础设施类型检查
        run: >
          mypy
          hscredit/core/model_selection.py
          hscredit/utils/serialization.py
          hscredit/utils/parallel.py
          --follow-imports=skip
          --ignore-missing-imports

      - name: 环境与公开示例验证
        run: |
          python scripts/validate_environment.py
          python examples/00_quickstart.py
          pytest tests/test_utils/test_documentation_examples.py -q

      - name: 构建文档
        run: python -m sphinx -b html docs docs/_build/html

  # 全功能测试：在声明支持的全部 Python 版本上安装所有可选依赖，
  # 执行 slow、integration 在内的完整测试集。仅允许缺失本地演示工作簿，
  # 或未配置真实数据库服务的集成用例按条件跳过。
  test:
    name: 全功能测试 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    env:
      HSCREDIT_STRICT_CI_SKIPS: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装全部依赖（含所有可选能力）
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"

      - name: 运行完整测试
        run: pytest tests/ --tb=short

  build-compat:
    name: 构建兼容 (Python ${{ matrix.python-version }}, setuptools ${{ matrix.setuptools-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.9"
            setuptools-version: "77.0.3"
            pkg_resources: "present"
          - python-version: "3.9"
            setuptools-version: "82.0.1"
            pkg_resources: "absent"
          - python-version: "3.10"
            setuptools-version: "latest"
            pkg_resources: "absent"
          - python-version: "3.11"
            setuptools-version: "latest"
            pkg_resources: "absent"
          - python-version: "3.12"
            setuptools-version: "latest"
            pkg_resources: "absent"
          - python-version: "3.13"
            setuptools-version: "latest"
            pkg_resources: "absent"
          - python-version: "3.14"
            setuptools-version: "latest"
            pkg_resources: "absent"
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装指定构建后端
        shell: bash
        run: |
          python -m pip install --upgrade pip build
          if [ "${{ matrix.setuptools-version }}" = "latest" ]; then
            python -m pip install --upgrade setuptools
          else
            python -m pip install "setuptools==${{ matrix.setuptools-version }}"
          fi

      - name: 验证 pkg_resources 状态
        env:
          EXPECTED_PKG_RESOURCES: ${{ matrix.pkg_resources }}
        run: |
          python - <<'PY'
          import importlib.util
          import os
          import setuptools

          found = importlib.util.find_spec("pkg_resources") is not None
          expected = os.environ["EXPECTED_PKG_RESOURCES"] == "present"
          print(f"setuptools={setuptools.__version__}, pkg_resources={found}")
          if found != expected:
              raise SystemExit("pkg_resources 状态与测试矩阵不一致")
          PY

      - name: 验证无隔离和 PEP 517 构建
        run: |
          python -m build --wheel --no-isolation --outdir dist-build-compat
          python -m pip wheel --no-deps --use-pep517 --wheel-dir dist-pep517 .

  build:
    name: 构建与打包校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: 构建发布包
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: 校验发布包元数据
        run: python -m twine check dist/*
