name: 发布文档到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: 构建文档
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安装项目和文档依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 构建 Sphinx 文档
        run: make docs

      - name: 校验 Pages 发布文件
        run: |
          test -f docs/_build/html/index.html
          test "$(cat docs/_build/html/CNAME)" = "hscredit.hengshucredit.com"
          test -f docs/_build/html/.nojekyll
          python scripts/validate_docs_build.py docs/_build/html

      - name: 上传 Pages 构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    name: 部署文档
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
