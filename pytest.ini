[pytest]
# Keep this file ASCII-only so older pytest/iniconfig versions can read it
# correctly on Windows systems whose default locale encoding is GBK.

# Add repository root to sys.path.
pythonpath = .

# Test discovery.
testpaths = tests

python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Default command-line options.
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Markers.
markers =
    slow: marks tests as slow
    integration: marks tests as integration tests
    unit: marks tests as unit tests

# Minimum pytest version.
minversion = 6.0

# Warning filters.
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
